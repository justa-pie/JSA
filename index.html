<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <style>html,body{background-color:#1a1a2e !important;}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrix - Discover Your Music</title>
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/pngtree-song-lyrics-icon-3d-png-image_16634818-2.webp">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Inter:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/styles/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="assets/images/pngtree-song-lyrics-icon-3d-png-image_16634818-2.webp" alt="Lyrix Logo" class="navbar-logo">
                Lyrix
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="fas fa-home"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pages/charts.html"><i class="fas fa-chart-line"></i> Charts</a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="nav-link btn-back" href="javascript:history.back()">
                            <i class="fas fa-chevron-left"></i> Back
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Home Section -->
    <section id="home" class="section active">
        <div class="container">
            <div class="search-container">
                <div class="mode-pills">
                    <button class="pill-item active" onclick="setSearchMode('song')">
                        <i class="fas fa-music"></i> Song Only
                    </button>
                    <button class="pill-item" onclick="setSearchMode('advanced')">
                        <i class="fas fa-sliders-h"></i> Advanced
                    </button>
                </div>

                <form class="search-box" onsubmit="event.preventDefault(); performSearch();">
                    <input type="text" id="searchInput" placeholder="Nhập tên bài hát...">
                    <button type="submit">
                        <i class="fas fa-search"></i>
                    </button>
                </form>

                <div id="searchResults"></div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    
    <script src="scripts/index.js"></script>
    <script src="scripts/navbar-auth.js"></script>
</body>
</html>
