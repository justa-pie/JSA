<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Trang cá nhân — Lyrix</title>
    <link rel="icon" href="../../assets/public/images/logo.webp"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="../styles/main.css"/>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
    /* ── Profile-specific styles ── */
    .profile-cover {
        height: 200px;
        background: linear-gradient(135deg, #3b0764 0%, #7c3aed 40%, #a855f7 70%, #ec4899 100%);
        border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        position: relative;
        overflow: hidden;
    }
    .profile-cover::before {
        content: "";
        position: absolute;
        inset: 0;
        background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .profile-cover-edit {
        position: absolute;
        bottom: .75rem;
        right: .75rem;
        background: rgba(0,0,0,.5);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255,255,255,.15);
        color: #fff;
        padding: .35rem .75rem;
        border-radius: 8px;
        font-size: .75rem;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: .4rem;
        transition: background .2s;
    }
    .profile-cover-edit:hover { background: rgba(0,0,0,.7); }

    .profile-card {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        overflow: hidden;
        margin-bottom: 1.5rem;
    }
    .profile-body {
        padding: 0 1.75rem 1.75rem;
    }
    .profile-avatar-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-top: -52px;
        margin-bottom: 1rem;
    }
    .profile-avatar-wrap { position: relative; flex-shrink: 0; }
    .profile-avatar {
        width: 104px;
        height: 104px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--brand), #a738db);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.75rem;
        font-weight: 800;
        color: #fff;
        border: 4px solid var(--surface-2);
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(124,58,237,.4);
    }
    .profile-avatar-edit {
        position: absolute;
        bottom: 4px; right: 4px;
        width: 28px; height: 28px;
        border-radius: 50%;
        background: var(--surface-3);
        border: 2px solid var(--surface-2);
        display: flex; align-items: center; justify-content: center;
        font-size: .68rem; color: var(--text-2);
        cursor: pointer; transition: var(--transition);
    }
    .profile-avatar-edit:hover { background: var(--brand); color: #fff; }

    .profile-name { font-size: 1.6rem; font-weight: 800; line-height: 1.2; }
    .profile-role { color: var(--brand-light); font-size: .875rem; font-weight: 500; margin-top: 2px; }
    .profile-email { color: var(--text-3); font-size: .8rem; margin-top: 3px; }
    .profile-bio {
        color: var(--text-2); font-size: .875rem; line-height: 1.65;
        margin-top: .6rem; max-width: 520px;
    }

    .profile-chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .75rem; }
    .profile-chip {
        display: inline-flex; align-items: center; gap: .35rem;
        padding: 3px 10px; border-radius: 100px;
        background: var(--surface-3); border: 1px solid var(--border);
        font-size: .73rem; color: var(--text-2);
    }

    .profile-stats-row {
        display: flex;
        gap: 0;
        border-top: 1px solid var(--border);
        margin-top: 1.25rem;
    }
    .profile-stat-box {
        flex: 1;
        padding: 1rem .5rem;
        text-align: center;
        border-right: 1px solid var(--border);
        cursor: pointer;
        transition: background .15s;
    }
    .profile-stat-box:last-child { border-right: none; }
    .profile-stat-box:hover { background: var(--surface-3); }
    .profile-stat-box.active { background: var(--surface-3); }
    .profile-stat-num {
        font-size: 1.35rem; font-weight: 800;
        font-family: "Be Vietnam Pro", sans-serif;
        color: var(--text-1);
    }
    .profile-stat-label {
        font-size: .67rem; color: var(--text-3);
        text-transform: uppercase; letter-spacing: .06em;
        font-weight: 600; margin-top: 2px;
    }

    /* Tabs */
    .profile-tabs-bar {
        display: flex;
        border-bottom: 1px solid var(--border);
        margin-bottom: 1.25rem;
        gap: 0;
    }
    .profile-tab-btn {
        flex: 1;
        padding: .75rem .5rem;
        text-align: center;
        font-size: .825rem; font-weight: 600;
        color: var(--text-3);
        cursor: pointer;
        border: none; background: none;
        font-family: "Inter", sans-serif;
        transition: var(--transition);
        border-bottom: 2px solid transparent;
        display: flex; align-items: center; justify-content: center; gap: .4rem;
        white-space: nowrap;
    }
    .profile-tab-btn:hover { color: var(--text-2); }
    .profile-tab-btn.active {
        color: var(--brand-light);
        border-bottom-color: var(--brand-light);
    }

    /* Content area */
    .profile-content { min-height: 200px; }

    /* Fix navbar avatar overflow */
    .navbar-avatar { overflow: hidden; }
    .navbar-avatar span { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }

    /* Ẩn orb nhỏ trên profile */
    .gradient-orb.orb-2 { display: none; }
    .gradient-orb.orb-3 { display: none; }

    /* Mobile */
    @media (max-width: 600px) {
        .profile-cover { height: 140px; }
        .profile-avatar { width: 84px; height: 84px; font-size: 2.1rem; }
        .profile-avatar-row { margin-top: -42px; }
        .profile-body { padding: 0 1rem 1.25rem; }
        .profile-name { font-size: 1.3rem; }
        .profile-stat-num { font-size: 1.1rem; }
    }
    </style>
</head>
<body>
<div class="gradient-orb orb-1"></div>
<div class="gradient-orb orb-2"></div>

<!-- NAVBAR -->
<nav class="navbar" id="navbar">
    <a class="navbar-brand" href="../../index.html">
        <img src="../../assets/public/images/logo.webp" style="width:32px;height:32px;border-radius:8px;object-fit:cover" alt="Lyrix"/>
        Lyrix
    </a>
    <div class="navbar-links">
        <a href="../../index.html">Khám phá</a>
        <a href="charts.html">Charts</a>
    </div>
    <div class="navbar-actions">
        <button class="btn-nav btn-nav-ghost" onclick="history.back()">
            <i class="fa-solid fa-arrow-left"></i> Quay lại
        </button>
        <div style="position:relative" id="userMenuWrap">
            <button class="navbar-avatar" id="navUserBtn" onclick="toggleUserMenu()" style="display:none">
                <span id="navUserInitial">U</span>
            </button>
            <div class="user-dropdown" id="userDropdown">
                <div class="user-dropdown-header">
                    <div class="user-dropdown-name" id="ddName">—</div>
                    <div class="user-dropdown-email" id="ddEmail">—</div>
                </div>
                <button class="user-dropdown-item" onclick="window.location.href='profile.html'">
                    <i class="fa-solid fa-user-circle"></i> Trang cá nhân
                </button>
                <button class="user-dropdown-item" onclick="signOut()">
                    <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                </button>
            </div>
        </div>
        <button class="btn-nav btn-nav-primary" id="navLoginBtn" onclick="openAuthModal()">
            <i class="fa-solid fa-user"></i> Đăng nhập
        </button>
    </div>
    <button class="navbar-toggler" id="navToggle" aria-label="Menu">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div class="navbar-collapse" id="navCollapse">
        <a href="../../index.html">Khám phá</a>
        <a href="charts.html">Charts</a>
        <button class="user-dropdown-item" id="mobileLoginBtn" onclick="openAuthModal()"
            style="border-radius:8px;margin-top:4px;display:flex">
            <i class="fa-solid fa-user"></i> Đăng nhập
        </button>
    </div>
</nav>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="authModalOverlay">
    <div class="modal">
        <button class="modal-close" onclick="closeAuthModal()"><i class="fa-solid fa-xmark"></i></button>
        <h2>Chào mừng</h2>
        <p class="modal-subtitle">Đăng nhập để lưu bài hát yêu thích</p>
        <div class="modal-tabs">
            <button class="modal-tab active" data-tab="login" onclick="switchTab('login')">Đăng nhập</button>
            <button class="modal-tab" data-tab="register" onclick="switchTab('register')">Đăng ký</button>
        </div>
        <div id="loginForm">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input class="form-input" id="loginEmail" type="email" placeholder="you@example.com" autocomplete="email"/>
            </div>
            <div class="form-group">
                <label class="form-label">Mật khẩu</label>
                <input class="form-input" id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password"/>
            </div>
            <div class="form-error" id="loginError"></div>
            <button class="btn btn-primary btn-full" id="loginBtn" data-label="Đăng nhập" onclick="handleLogin()">Đăng nhập</button>
            <div class="divider">hoặc</div>
            <button class="btn-google" onclick="handleGoogle()">
                <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.5 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.8 6c1.8-5.4 6.8-9.8 13.6-9.8z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17z"/><path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.7 0-12.4-4.5-14.4-10.6l-7.8 6C6.5 42.5 14.6 48 24 48z"/></svg>
                Tiếp tục với Google
            </button>
        </div>
        <div id="registerForm" style="display:none">
            <div class="form-group">
                <label class="form-label">Tên hiển thị</label>
                <input class="form-input" id="registerName" type="text" placeholder="Tên của bạn" autocomplete="name"/>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input class="form-input" id="registerEmail" type="email" placeholder="you@example.com" autocomplete="email"/>
            </div>
            <div class="form-group">
                <label class="form-label">Mật khẩu</label>
                <input class="form-input" id="registerPassword" type="password" placeholder="Ít nhất 6 ký tự" autocomplete="new-password"/>
            </div>
            <div class="form-error" id="registerError"></div>
            <button class="btn btn-primary btn-full" id="registerBtn" data-label="Đăng ký" onclick="handleRegister()">Đăng ký</button>
            <div class="divider">hoặc</div>
            <button class="btn-google" onclick="handleGoogle()">
                <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.5 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.8 6c1.8-5.4 6.8-9.8 13.6-9.8z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17z"/><path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.7 0-12.4-4.5-14.4-10.6l-7.8 6C6.5 42.5 14.6 48 24 48z"/></svg>
                Tiếp tục với Google
            </button>
        </div>
    </div>
</div>

<main>
<div class="container" style="padding-top:1.5rem;padding-bottom:3rem">

    <!-- ── PROFILE CARD ── -->
    <div class="profile-card animate-slide-up">
        <!-- Cover banner -->
        <div class="profile-cover" id="profileCover">
            <button class="profile-cover-edit" onclick="document.getElementById('coverInput').click()">
                <i class="fa-solid fa-camera"></i> Đổi ảnh bìa
            </button>
            <input type="file" id="coverInput" accept="image/*" style="display:none" onchange="handleCoverChange(event)"/>
        </div>

        <!-- Body -->
        <div class="profile-body">
            <div class="profile-avatar-row">
                <!-- Avatar -->
                <div class="profile-avatar-wrap">
                    <div class="profile-avatar" id="profileAvatar">U</div>
                    <label class="profile-avatar-edit" title="Đổi ảnh đại diện">
                        <i class="fa-solid fa-camera"></i>
                        <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatarChange(event)"/>
                    </label>
                </div>
                <!-- Edit button -->
                <button class="btn btn-outline btn-sm" onclick="openEditModal()" style="margin-bottom:4px">
                    <i class="fa-solid fa-pen"></i> Chỉnh sửa
                </button>
            </div>

            <!-- Name & info -->
            <div class="profile-name" id="profileName">—</div>
            <div class="profile-role" id="profileRole"></div>
            <div class="profile-email" id="profileEmail"></div>
            <div class="profile-bio" id="profileBio"></div>
            <div class="profile-chips" id="profileInfoChips"></div>
        </div>

        <!-- Stats row (clickable → switch tab) -->
        <div class="profile-stats-row">
            <div class="profile-stat-box active" id="statBox_favorites" onclick="switchProfileTab('favorites')">
                <div class="profile-stat-num" id="statFavorites">0</div>
                <div class="profile-stat-label">Yêu thích</div>
            </div>
            <div class="profile-stat-box" id="statBox_history" onclick="switchProfileTab('history')">
                <div class="profile-stat-num" id="statHistory">0</div>
                <div class="profile-stat-label">Đã xem</div>
            </div>
            <div class="profile-stat-box" id="statBox_playlists" onclick="switchProfileTab('playlists')">
                <div class="profile-stat-num" id="statPlaylists">0</div>
                <div class="profile-stat-label">Playlist</div>
            </div>
            <div class="profile-stat-box" id="statBox_photos" onclick="switchProfileTab('photos')">
                <div class="profile-stat-num" id="statPhotos">—</div>
                <div class="profile-stat-label">Ảnh</div>
            </div>
            <div class="profile-stat-box" style="cursor:default">
                <div class="profile-stat-num" id="statJoined" style="font-size:.9rem">—</div>
                <div class="profile-stat-label">Tham gia</div>
            </div>
        </div>
    </div>

    <!-- ── TABS ── -->
    <div class="profile-tabs-bar animate-slide-up stagger-1">
        <button class="profile-tab-btn active" onclick="switchProfileTab('favorites')" id="tab_favorites">
            <i class="fa-solid fa-heart"></i> Yêu thích
        </button>
        <button class="profile-tab-btn" onclick="switchProfileTab('history')" id="tab_history">
            <i class="fa-solid fa-clock-rotate-left"></i> Lịch sử
        </button>
        <button class="profile-tab-btn" onclick="switchProfileTab('playlists')" id="tab_playlists">
            <i class="fa-solid fa-list-music"></i> Playlist
        </button>
        <button class="profile-tab-btn" onclick="switchProfileTab('photos')" id="tab_photos">
            <i class="fa-solid fa-images"></i> Ảnh
        </button>
    </div>

    <!-- ── TAB CONTENT ── -->
    <div id="profileTabContent" class="profile-content animate-slide-up stagger-2">
        <div style="display:flex;flex-direction:column;gap:.5rem">
            <div class="skeleton" style="height:72px;border-radius:12px"></div>
            <div class="skeleton" style="height:72px;border-radius:12px"></div>
            <div class="skeleton" style="height:72px;border-radius:12px"></div>
            <div class="skeleton" style="height:72px;border-radius:12px"></div>
        </div>
    </div>

</div>
</main>

<!-- EDIT PROFILE MODAL -->
<div class="modal-overlay" id="editModalOverlay">
    <div class="modal" style="max-width:480px">
        <button class="modal-close" onclick="closeEditModal()"><i class="fa-solid fa-xmark"></i></button>
        <h2 style="font-size:1.25rem;margin-bottom:1.25rem">Chỉnh sửa hồ sơ</h2>
        <div class="form-group">
            <label class="form-label">Tên hiển thị</label>
            <input class="form-input" id="editName" type="text" placeholder="Tên của bạn"/>
        </div>
        <div class="form-group">
            <label class="form-label">Chức danh / Vai trò</label>
            <input class="form-input" id="editRole" type="text" placeholder="VD: Sinh viên CNTT, Music lover…"/>
        </div>
        <div class="form-group">
            <label class="form-label">Giới thiệu bản thân</label>
            <textarea class="form-input" id="editBio" rows="3" placeholder="Viết vài dòng về bạn…" style="resize:vertical"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">Ngày sinh</label>
            <input class="form-input" id="editDob" type="date"/>
        </div>
        <div class="form-group">
            <label class="form-label">Số điện thoại</label>
            <input class="form-input" id="editPhone" type="tel" placeholder="+84 xxx xxx xxx"/>
        </div>
        <div class="form-group">
            <label class="form-label">Địa điểm</label>
            <input class="form-input" id="editLocation" type="text" placeholder="Thành phố, Quốc gia"/>
        </div>
        <div class="form-error" id="editError"></div>
        <div style="display:flex;gap:.75rem;margin-top:.5rem">
            <button class="btn btn-outline" style="flex:1;justify-content:center" onclick="closeEditModal()">Huỷ</button>
            <button class="btn btn-primary" style="flex:1;justify-content:center" id="saveEditBtn" data-label="Lưu thay đổi" onclick="saveProfile()">Lưu thay đổi</button>
        </div>
    </div>
</div>

<!-- PLAYLIST MODAL -->
<div class="modal-overlay" id="plModalOverlay">
    <div class="modal" style="max-width:400px">
        <button class="modal-close" onclick="closePlModal()"><i class="fa-solid fa-xmark"></i></button>
        <h2 id="plModalTitle" style="font-size:1.25rem;margin-bottom:1.25rem">Tạo playlist</h2>
        <div style="display:flex;justify-content:center;margin-bottom:1.25rem">
            <label style="cursor:pointer;position:relative" title="Chọn ảnh bìa">
                <div class="pl-cover-preview" id="plCoverWrap">
                    <img id="plCoverPreview" src="" alt="" style="display:none;width:100%;height:100%;object-fit:cover;border-radius:12px"/>
                    <div id="plCoverPlaceholder" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;color:var(--text-3)">
                        <i class="fa-solid fa-image" style="font-size:2rem"></i>
                        <span style="font-size:.8rem">Chọn ảnh bìa</span>
                    </div>
                </div>
                <input type="file" accept="image/*" style="display:none" onchange="handlePlCoverChange(event)"/>
            </label>
        </div>
        <div class="form-group">
            <label class="form-label">Tên playlist</label>
            <input class="form-input" id="plName" type="text" placeholder="Tên playlist của bạn…"/>
        </div>
        <div class="form-error" id="plError"></div>
        <div style="display:flex;gap:.75rem;margin-top:.5rem;flex-wrap:wrap">
            <button class="btn btn-outline" style="flex:1;justify-content:center;min-width:80px" onclick="closePlModal()">Huỷ</button>
            <button class="btn btn-danger btn-sm" id="deletePlBtn" style="display:none" onclick="deletePlaylist(document.getElementById('savePlBtn').dataset.plId)">
                <i class="fa-solid fa-trash"></i> Xoá
            </button>
            <button class="btn btn-primary" style="flex:1;justify-content:center;min-width:80px" id="savePlBtn" data-label="Lưu" data-mode="create" data-pl-id="" onclick="savePlaylist()">Lưu</button>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="container">
        <div class="footer-inner">
            <div class="footer-brand"><i class="fa-solid fa-music"></i> Lyrix</div>
            <div class="footer-links">
                <a href="../../index.html">Trang chủ</a>
                <a href="charts.html">Charts</a>
            </div>
            <div class="footer-copy">© 2025 Lyrix.</div>
        </div>
    </div>
</footer>

<script src="../scripts/api/genius.js"></script>
<script src="../scripts/pages/profile.js"></script>
<script src="../scripts/components/auth.js"></script>
<script src="../scripts/components/navbar.js"></script>
</body>
</html>
