<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Đăng nhập - Lyrix</title>
        <meta
            name="description"
            content="Đăng nhập Lyrix để lưu yêu thích của bạn"
        />
        <link rel="icon" href="../../assets/public/images/logo.webp" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link rel="stylesheet" href="../styles/main.css" />
        <style>
            .auth-container {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1.5rem;
            }
            .auth-card {
                width: 100%;
                max-width: 400px;
                background: var(--surface-2);
                border: 1px solid var(--border);
                border-radius: var(--radius-lg);
                padding: 2.5rem;
            }
            .auth-header {
                text-align: center;
                margin-bottom: 2rem;
            }
            .auth-header h1 {
                font-size: 1.75rem;
                margin-bottom: 0.5rem;
            }
            .auth-header p {
                color: var(--text-2);
                font-size: 0.95rem;
            }
            .form-group {
                margin-bottom: 1.5rem;
            }
            .form-label {
                display: block;
                margin-bottom: 0.5rem;
                font-weight: 500;
                color: var(--text-1);
                font-size: 0.9rem;
            }
            .form-input {
                width: 100%;
                padding: 0.75rem 1rem;
                background: var(--surface-3);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                color: var(--text-1);
                font-size: 0.95rem;
                font-family: "Inter", "Be Vietnam Pro", sans-serif;
                transition: var(--transition);
            }
            .form-input:focus {
                outline: none;
                border-color: var(--brand);
                box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
            }
            .form-input::placeholder {
                color: var(--text-3);
            }
            .btn-submit {
                width: 100%;
                padding: 0.85rem;
                background: linear-gradient(135deg, var(--brand), #5b21b6);
                color: #fff;
                border: none;
                border-radius: var(--radius);
                font-weight: 600;
                cursor: pointer;
                transition: var(--transition);
                font-size: 0.95rem;
            }
            .btn-submit:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(124, 58, 237, 0.5);
            }
            .btn-submit:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                transform: none;
            }
            .auth-toggle {
                text-align: center;
                margin-top: 1.5rem;
                font-size: 0.9rem;
            }
            .auth-toggle a {
                color: var(--brand-light);
                text-decoration: none;
                cursor: pointer;
                font-weight: 600;
            }
            .auth-toggle a:hover {
                text-decoration: underline;
            }
            .error-msg {
                color: #ef4444;
                font-size: 0.85rem;
                margin-top: 0.5rem;
                display: none;
            }
            .loading-spinner {
                display: none;
                width: 20px;
                height: 20px;
                border: 3px solid rgba(255, 255, 255, 0.3);
                border-top: 3px solid #fff;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                margin: 0 auto;
            }
            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
            .btn-submit.loading {
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>

        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1><i class="fa-solid fa-user-circle"></i> Lyrix</h1>
                    <p id="authSubtitle">Đăng nhập để tiếp tục</p>
                </div>

                <form id="loginForm" style="display: block">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input
                            type="email"
                            class="form-input"
                            id="loginEmail"
                            placeholder="your@email.com"
                            required
                        />
                        <div class="error-msg" id="loginEmailError"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mật khẩu</label>
                        <input
                            type="password"
                            class="form-input"
                            id="loginPassword"
                            placeholder="••••••••"
                            required
                        />
                        <div class="error-msg" id="loginPasswordError"></div>
                    </div>
                    <button type="submit" class="btn-submit" id="loginBtn">
                        <span id="loginBtnText">Đăng nhập</span>
                        <div class="loading-spinner" id="loginSpinner"></div>
                    </button>
                    <div class="error-msg" id="loginError"></div>
                    <div class="auth-toggle">
                        Chưa có tài khoản?
                        <a onclick="switchToSignup()">Đăng ký</a>
                    </div>
                </form>

                <form id="signupForm" style="display: none">
                    <div class="form-group">
                        <label class="form-label">Tên</label>
                        <input
                            type="text"
                            class="form-input"
                            id="signupName"
                            placeholder="Tên của bạn"
                            required
                        />
                        <div class="error-msg" id="signupNameError"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input
                            type="email"
                            class="form-input"
                            id="signupEmail"
                            placeholder="your@email.com"
                            required
                        />
                        <div class="error-msg" id="signupEmailError"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mật khẩu</label>
                        <input
                            type="password"
                            class="form-input"
                            id="signupPassword"
                            placeholder="••••••••"
                            required
                        />
                        <div class="error-msg" id="signupPasswordError"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Xác nhận mật khẩu</label>
                        <input
                            type="password"
                            class="form-input"
                            id="signupPasswordConfirm"
                            placeholder="••••••••"
                            required
                        />
                        <div
                            class="error-msg"
                            id="signupPasswordConfirmError"
                        ></div>
                    </div>
                    <button type="submit" class="btn-submit" id="signupBtn">
                        <span id="signupBtnText">Đăng ký</span>
                        <div class="loading-spinner" id="signupSpinner"></div>
                    </button>
                    <div class="error-msg" id="signupError"></div>
                    <div class="auth-toggle">
                        Đã có tài khoản?
                        <a onclick="switchToLogin()">Đăng nhập</a>
                    </div>
                </form>
            </div>
        </div>

        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
            import {
                getAuth,
                createUserWithEmailAndPassword,
                signInWithEmailAndPassword,
            } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
            import {
                getFirestore,
                setDoc,
                doc,
            } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

            const firebaseConfig = {
                apiKey: "AIzaSyANhY8Ze06tNkGF2MQmujPY2gXsMgIYMG4",
                authDomain: "lyrix-b258b.firebaseapp.com",
                projectId: "lyrix-b258b",
                storageBucket: "lyrix-b258b.firebasestorage.app",
                messagingSenderId: "586165994873",
                appId: "1:586165994873:web:7a48b5181409abfe459ba8",
                measurementId: "G-DWKZ9NW50Q",
            };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            window.auth = auth;
            window.db = db;
            window.createUserWithEmailAndPassword =
                createUserWithEmailAndPassword;
            window.signInWithEmailAndPassword = signInWithEmailAndPassword;
            window.setDoc = setDoc;
            window.doc = doc;
        </script>

        <script>
            const loginForm = document.getElementById("loginForm");
            const signupForm = document.getElementById("signupForm");

            window.switchToSignup = function () {
                loginForm.style.display = "none";
                signupForm.style.display = "block";
                document.getElementById("authSubtitle").textContent =
                    "Tạo tài khoản mới";
            };

            window.switchToLogin = function () {
                signupForm.style.display = "none";
                loginForm.style.display = "block";
                document.getElementById("authSubtitle").textContent =
                    "Đăng nhập để tiếp tục";
                clearErrors();
            };

            function clearErrors() {
                document.querySelectorAll(".error-msg").forEach((el) => {
                    el.style.display = "none";
                    el.textContent = "";
                });
            }

            loginForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                clearErrors();

                const email = document
                    .getElementById("loginEmail")
                    .value.trim();
                const password = document.getElementById("loginPassword").value;

                if (!email || !password) {
                    showError("loginError", "Vui lòng nhập email và mật khẩu");
                    return;
                }

                try {
                    setLoading(true, "loginBtn");
                    await window.signInWithEmailAndPassword(
                        window.auth,
                        email,
                        password,
                    );
                    localStorage.setItem("userEmail", email);
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 500);
                } catch (err) {
                    let message = "Đã xảy ra lỗi";
                    if (err.code === "auth/user-not-found") {
                        message = "Email không tồn tại";
                    } else if (err.code === "auth/wrong-password") {
                        message = "Mật khẩu không chính xác";
                    } else if (err.code === "auth/invalid-email") {
                        message = "Email không hợp lệ";
                    }
                    showError("loginError", message);
                } finally {
                    setLoading(false, "loginBtn");
                }
            });

            signupForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                clearErrors();

                const name = document.getElementById("signupName").value.trim();
                const email = document
                    .getElementById("signupEmail")
                    .value.trim();
                const password =
                    document.getElementById("signupPassword").value;
                const passwordConfirm = document.getElementById(
                    "signupPasswordConfirm",
                ).value;

                if (!name) {
                    showError("signupNameError", "Vui lòng nhập tên");
                    return;
                }
                if (!email) {
                    showError("signupEmailError", "Vui lòng nhập email");
                    return;
                }
                if (!password) {
                    showError("signupPasswordError", "Vui lòng nhập mật khẩu");
                    return;
                }
                if (password.length < 6) {
                    showError(
                        "signupPasswordError",
                        "Mật khẩu phải có ít nhất 6 ký tự",
                    );
                    return;
                }
                if (password !== passwordConfirm) {
                    showError(
                        "signupPasswordConfirmError",
                        "Mật khẩu không khớp",
                    );
                    return;
                }

                try {
                    setLoading(true, "signupBtn");
                    const userCredential =
                        await window.createUserWithEmailAndPassword(
                            window.auth,
                            email,
                            password,
                        );
                    const user = userCredential.user;

                    await window.setDoc(
                        window.doc(window.db, "users", user.uid),
                        {
                            uid: user.uid,
                            name: name,
                            email: email,
                            createdAt: new Date().toISOString(),
                            favorites: [],
                        },
                    );

                    localStorage.setItem("userEmail", email);
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 500);
                } catch (err) {
                    let message = "Đã xảy ra lỗi";
                    if (err.code === "auth/email-already-in-use") {
                        message = "Email này đã được đăng ký";
                    } else if (err.code === "auth/invalid-email") {
                        message = "Email không hợp lệ";
                    } else if (err.code === "auth/weak-password") {
                        message = "Mật khẩu quá yếu";
                    }
                    showError("signupError", message);
                } finally {
                    setLoading(false, "signupBtn");
                }
            });

            function showError(elementId, message) {
                const errorEl = document.getElementById(elementId);
                errorEl.textContent = message;
                errorEl.style.display = "block";
            }

            function setLoading(isLoading, btnId) {
                const btn = document.getElementById(btnId);
                const spinner = btn.querySelector(".loading-spinner");
                const btnText = btn.querySelector("span");

                if (isLoading) {
                    btn.disabled = true;
                    btn.classList.add("loading");
                    spinner.style.display = "block";
                    btnText.style.display = "none";
                } else {
                    btn.disabled = false;
                    btn.classList.remove("loading");
                    spinner.style.display = "none";
                    btnText.style.display = "inline";
                }
            }
        </script>
    </body>
</html>
