<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Chi tiết bài hát — Lyrix</title>
        <link rel="icon" href="../../assets/public/images/logo.webp" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link rel="stylesheet" href="../styles/main.css" />
    </head>
    <body>
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>

        <nav class="navbar" id="navbar">
            <a class="navbar-brand" href="index.html">
                <div class="logo-icon"><i class="fa-solid fa-music"></i></div>
                Lyrix
            </a>
            <div class="navbar-links">
                <a href="index.html">Khám phá</a>
                <a href="charts.html">Charts</a>
            </div>
            <div class="navbar-actions">
                <button class="btn-nav btn-nav-ghost" onclick="history.back()">
                    <i class="fa-solid fa-arrow-left"></i> Quay lại
                </button>
            </div>
            <button class="navbar-toggler" id="navToggle">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="navbar-collapse" id="navCollapse">
                <a href="index.html">Khám phá</a>
                <a href="charts.html">Charts</a>
            </div>
        </nav>

        <main>
            <div
                class="container"
                style="padding-top: 2rem; padding-bottom: 3rem"
            >
                <div id="songDetailContent">
                    <!-- Skeleton header -->
                    <div class="song-detail-header">
                        <div
                            class="skeleton"
                            style="
                                width: 140px;
                                height: 140px;
                                border-radius: 12px;
                                flex-shrink: 0;
                            "
                        ></div>
                        <div
                            style="
                                flex: 1;
                                display: flex;
                                flex-direction: column;
                                gap: 10px;
                            "
                        >
                            <div
                                class="skeleton"
                                style="height: 32px; width: 70%"
                            ></div>
                            <div
                                class="skeleton"
                                style="height: 18px; width: 40%"
                            ></div>
                            <div
                                style="display: flex; gap: 8px; margin-top: 4px"
                            >
                                <div
                                    class="skeleton"
                                    style="
                                        height: 28px;
                                        width: 80px;
                                        border-radius: 8px;
                                    "
                                ></div>
                                <div
                                    class="skeleton"
                                    style="
                                        height: 28px;
                                        width: 100px;
                                        border-radius: 8px;
                                    "
                                ></div>
                                <div
                                    class="skeleton"
                                    style="
                                        height: 28px;
                                        width: 90px;
                                        border-radius: 8px;
                                    "
                                ></div>
                            </div>
                        </div>
                    </div>
                    <div class="two-column-layout">
                        <div class="left-column">
                            <div
                                class="skeleton"
                                style="height: 200px; border-radius: 16px"
                            ></div>
                        </div>
                        <div class="right-column">
                            <div
                                class="skeleton"
                                style="height: 500px; border-radius: 16px"
                            ></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="container">
                <div class="footer-inner">
                    <div class="footer-brand">
                        <i class="fa-solid fa-music"></i> Lyrix
                    </div>
                    <div class="footer-links">
                        <a href="index.html">Trang chủ</a
                        ><a href="charts.html">Charts</a>
                    </div>
                    <div class="footer-copy">© 2025 Lyrix.</div>
                </div>
            </div>
        </footer>

        <script src="../scripts/api/genius.js"></script>
        <script src="../scripts/pages/details-song.js"></script>
        <script src="../scripts/components/navbar.js"></script>
    </body>
</html>
