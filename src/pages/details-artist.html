<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Chi tiết nghệ sĩ — Lyrix</title>
        <link rel="icon" href="../../assets/public/images/logo.webp" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link rel="stylesheet" href="../styles/main.css" />
    </head>
    <body>
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>

        <nav class="navbar" id="navbar">
            <a class="navbar-brand" href="index.html"
                ><div class="logo-icon"><i class="fa-solid fa-music"></i></div>
                Lyrix</a
            >
            <div class="navbar-links">
                <a href="index.html">Khám phá</a>
                <a href="charts.html">Charts</a>
            </div>
            <div class="navbar-actions">
                <button class="btn-nav btn-nav-ghost" onclick="history.back()">
                    <i class="fa-solid fa-arrow-left"></i> Quay lại
                </button>
            </div>
            <button class="navbar-toggler" id="navToggle">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="navbar-collapse" id="navCollapse">
                <a href="index.html">Khám phá</a>
                <a href="charts.html">Charts</a>
            </div>
        </nav>

        <main>
            <div
                class="container"
                style="padding-top: 2rem; padding-bottom: 3rem"
            >
                <!-- Banner hero -->
                <div
                    id="artistBanner"
                    style="
                        width: 100%;
                        height: 220px;
                        border-radius: 20px;
                        background: var(--surface-3);
                        margin-bottom: -60px;
                        position: relative;
                        overflow: hidden;
                    "
                >
                    <div
                        id="artistBannerImg"
                        style="
                            width: 100%;
                            height: 100%;
                            object-fit: cover;
                            background: linear-gradient(
                                135deg,
                                var(--brand-dark),
                                var(--surface-3)
                            );
                        "
                    ></div>
                    <div
                        style="
                            position: absolute;
                            inset: 0;
                            background: linear-gradient(
                                to bottom,
                                transparent 40%,
                                var(--surface) 100%
                            );
                        "
                    ></div>
                </div>

                <div
                    id="artistDetailContent"
                    style="position: relative; z-index: 1"
                >
                    <div class="artist-detail-header">
                        <div class="skeleton detail-cover artist-cover"></div>
                        <div
                            style="
                                flex: 1;
                                display: flex;
                                flex-direction: column;
                                gap: 8px;
                            "
                        >
                            <div
                                class="skeleton"
                                style="height: 28px; width: 50%"
                            ></div>
                            <div
                                class="skeleton"
                                style="height: 16px; width: 30%"
                            ></div>
                        </div>
                    </div>
                    <div class="two-column-layout">
                        <div class="left-column">
                            <div
                                class="skeleton"
                                style="height: 180px; border-radius: 16px"
                            ></div>
                        </div>
                        <div class="right-column">
                            <div
                                class="skeleton"
                                style="
                                    height: 60px;
                                    border-radius: 10px;
                                    margin-bottom: 1rem;
                                "
                            ></div>
                            <div
                                style="
                                    display: flex;
                                    flex-direction: column;
                                    gap: 0.5rem;
                                "
                            >
                                ${Array(6).fill('
                                <div
                                    class="skeleton"
                                    style="height: 68px; border-radius: 12px"
                                ></div>
                                ').join('')}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="container">
                <div class="footer-inner">
                    <div class="footer-brand">
                        <i class="fa-solid fa-music"></i> Lyrix
                    </div>
                    <div class="footer-links">
                        <a href="index.html">Trang chủ</a
                        ><a href="charts.html">Charts</a>
                    </div>
                    <div class="footer-copy">© 2025 Lyrix.</div>
                </div>
            </div>
        </footer>

        <script src="../scripts/api/genius.js"></script>
        <script src="../scripts/pages/details-artist.js"></script>
        <script src="../scripts/components/navbar.js"></script>
    </body>
</html>
