<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Top Charts — Lyrix</title>
        <link rel="icon" href="../../assets/public/images/logo.webp" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link rel="stylesheet" href="../styles/main.css" />
        <!-- Firebase -->
        <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    </head>
    <body>
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <!-- Auth Modal -->
        <div class="modal-overlay" id="authModalOverlay">
            <div class="modal">
                <button class="modal-close" onclick="closeAuthModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <h2>Chào mừng</h2>
                <p class="modal-subtitle">Đăng nhập để lưu bài hát yêu thích</p>
                <div class="modal-tabs">
                    <button
                        class="modal-tab active"
                        data-tab="login"
                        onclick="switchTab('login')"
                    >
                        Đăng nhập
                    </button>
                    <button
                        class="modal-tab"
                        data-tab="register"
                        onclick="switchTab('register')"
                    >
                        Đăng ký
                    </button>
                </div>
                <div id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input
                            class="form-input"
                            id="loginEmail"
                            type="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                        />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mật khẩu</label>
                        <input
                            class="form-input"
                            id="loginPassword"
                            type="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                        />
                    </div>
                    <div class="form-error" id="loginError"></div>
                    <button
                        class="btn btn-primary btn-full"
                        id="loginBtn"
                        data-label="Đăng nhập"
                        onclick="handleLogin()"
                    >
                        Đăng nhập
                    </button>
                    <div class="divider">hoặc</div>
                    <button class="btn-google" onclick="handleGoogle()">
                        <svg width="18" height="18" viewBox="0 0 48 48">
                            <path
                                fill="#EA4335"
                                d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.5 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.8 6c1.8-5.4 6.8-9.8 13.6-9.8z"
                            />
                            <path
                                fill="#4285F4"
                                d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17z"
                            />
                            <path
                                fill="#FBBC05"
                                d="M10.4 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.8-6z"
                            />
                            <path
                                fill="#34A853"
                                d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.7 0-12.4-4.5-14.4-10.6l-7.8 6C6.5 42.5 14.6 48 24 48z"
                            />
                        </svg>
                        Tiếp tục với Google
                    </button>
                </div>
                <div id="registerForm" style="display: none">
                    <div class="form-group">
                        <label class="form-label">Tên hiển thị</label>
                        <input
                            class="form-input"
                            id="registerName"
                            type="text"
                            placeholder="Tên của bạn"
                            autocomplete="name"
                        />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input
                            class="form-input"
                            id="registerEmail"
                            type="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                        />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mật khẩu</label>
                        <input
                            class="form-input"
                            id="registerPassword"
                            type="password"
                            placeholder="Ít nhất 6 ký tự"
                            autocomplete="new-password"
                        />
                    </div>
                    <div class="form-error" id="registerError"></div>
                    <button
                        class="btn btn-primary btn-full"
                        id="registerBtn"
                        data-label="Đăng ký"
                        onclick="handleRegister()"
                    >
                        Đăng ký
                    </button>
                    <div class="divider">hoặc</div>
                    <button class="btn-google" onclick="handleGoogle()">
                        <svg width="18" height="18" viewBox="0 0 48 48">
                            <path
                                fill="#EA4335"
                                d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.5 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.8 6c1.8-5.4 6.8-9.8 13.6-9.8z"
                            />
                            <path
                                fill="#4285F4"
                                d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17z"
                            />
                            <path
                                fill="#FBBC05"
                                d="M10.4 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.8-6z"
                            />
                            <path
                                fill="#34A853"
                                d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.7 0-12.4-4.5-14.4-10.6l-7.8 6C6.5 42.5 14.6 48 24 48z"
                            />
                        </svg>
                        Tiếp tục với Google
                    </button>
                </div>
            </div>
        </div>

        <main>
            <div class="container" style="padding-top: 2.5rem">
                <!-- Header -->
                <div class="animate-slide-up" style="margin-bottom: 2rem">
                    <div class="hero-eyebrow">
                        <span class="badge badge-hot"
                            ><i class="fa-solid fa-fire"></i> Live Charts</span
                        >
                    </div>
                    <h1 style="margin-bottom: 0.5rem">Top Charts</h1>
                    <p style="color: var(--text-2)">
                        Bảng xếp hạng âm nhạc toàn cầu được cập nhật liên tục.
                    </p>
                </div>

                <!-- Filters -->
                <div
                    class="animate-slide-up stagger-1"
                    style="
                        display: flex;
                        gap: 1rem;
                        flex-wrap: wrap;
                        margin-bottom: 2rem;
                        align-items: center;
                    "
                >
                    <div class="tab-group" id="chartTypeTabs">
                        <button class="tab-btn active" data-type="songs">
                            <i class="fa-solid fa-music"></i> Bài hát
                        </button>
                        <button class="tab-btn" data-type="artists">
                            <i class="fa-solid fa-microphone"></i> Nghệ sĩ
                        </button>
                        <button class="tab-btn" data-type="albums">
                            <i class="fa-solid fa-compact-disc"></i> Album
                        </button>
                    </div>
                    <div class="tab-group" id="timePeriodTabs">
                        <button class="tab-btn active" data-period="day">
                            Hôm nay
                        </button>
                        <button class="tab-btn" data-period="week">Tuần</button>
                        <button class="tab-btn" data-period="month">
                            Tháng
                        </button>
                        <button class="tab-btn" data-period="all_time">
                            All time
                        </button>
                    </div>
                </div>

                <!-- Stats summary -->
                <div
                    class="card animate-slide-up stagger-2"
                    style="padding: 1.25rem; margin-bottom: 1.5rem"
                >
                    <div class="stats-bar">
                        <div class="stat-item">
                            <div class="stat-value" id="statTotal">—</div>
                            <div class="stat-label">Bài hát</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="statTop">—</div>
                            <div class="stat-label">Top #1 hôm nay</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="statPeriod">
                                Hôm nay
                            </div>
                            <div class="stat-label">Khoảng thời gian</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">Genius</div>
                            <div class="stat-label">Nguồn dữ liệu</div>
                        </div>
                    </div>
                </div>

                <!-- Chart list -->
                <div class="animate-slide-up stagger-3">
                    <div
                        id="chartList"
                        style="
                            display: flex;
                            flex-direction: column;
                            gap: 0.5rem;
                        "
                    >
                        <!-- Skeleton -->
                        ${Array(10).fill(0).map((_, i) => `
                        <div class="chart-item">
                            <span class="chart-position">${i+1}</span>
                            <div class="skeleton chart-image"></div>
                            <div class="chart-info">
                                <div
                                    class="skeleton"
                                    style="
                                        height: 14px;
                                        width: 55%;
                                        margin-bottom: 6px;
                                    "
                                ></div>
                                <div
                                    class="skeleton"
                                    style="height: 12px; width: 38%"
                                ></div>
                            </div>
                        </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="container">
                <div class="footer-inner">
                    <div class="footer-brand">
                        <i class="fa-solid fa-music"></i> Lyrix
                    </div>
                    <div class="footer-links">
                        <a href="../../index.html">Trang chủ</a>
                    </div>
                    <div class="footer-copy">© 2025 Lyrix.</div>
                </div>
            </div>
        </footer>

        <script src="../scripts/api/genius.js"></script>
        <script src="../scripts/components/auth.js"></script>
        <script src="../scripts/components/navbar.js"></script>
        <script src="../scripts/pages/charts.js"></script>
    </body>
</html>
