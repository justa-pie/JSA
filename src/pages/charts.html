<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Top Charts — Lyrix</title>
        <link rel="icon" href="../../assets/public/images/logo.webp" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link rel="stylesheet" href="../styles/main.css" />
    </head>
    <body>
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>

        <nav class="navbar" id="navbar">
            <a class="navbar-brand" href="index.html">
                <div class="logo-icon"><i class="fa-solid fa-music"></i></div>
                Lyrix
            </a>
            <div class="navbar-links">
                <a href="index.html">Khám phá</a>
                <a href="charts.html" class="active">Charts</a>
            </div>
            <div class="navbar-actions">
                <button
                    class="btn-nav btn-nav-ghost"
                    onclick="window.location.href = 'index.html'"
                >
                    <i class="fa-solid fa-arrow-left"></i> Trang chủ
                </button>
            </div>
            <button class="navbar-toggler" id="navToggle">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="navbar-collapse" id="navCollapse">
                <a href="index.html">Khám phá</a>
                <a href="charts.html">Charts</a>
            </div>
        </nav>

        <main>
            <div class="container" style="padding-top: 2.5rem">
                <!-- Header -->
                <div class="animate-slide-up" style="margin-bottom: 2rem">
                    <div class="hero-eyebrow">
                        <span class="badge badge-hot"
                            ><i class="fa-solid fa-fire"></i> Live Charts</span
                        >
                    </div>
                    <h1 style="margin-bottom: 0.5rem">Top Charts</h1>
                    <p style="color: var(--text-2)">
                        Bảng xếp hạng âm nhạc toàn cầu được cập nhật liên tục.
                    </p>
                </div>

                <!-- Filters -->
                <div
                    class="animate-slide-up stagger-1"
                    style="
                        display: flex;
                        gap: 1rem;
                        flex-wrap: wrap;
                        margin-bottom: 2rem;
                        align-items: center;
                    "
                >
                    <div class="tab-group" id="chartTypeTabs">
                        <button class="tab-btn active" data-type="songs">
                            <i class="fa-solid fa-music"></i> Bài hát
                        </button>
                        <button class="tab-btn" data-type="artists">
                            <i class="fa-solid fa-microphone"></i> Nghệ sĩ
                        </button>
                        <button class="tab-btn" data-type="albums">
                            <i class="fa-solid fa-compact-disc"></i> Album
                        </button>
                    </div>
                    <div class="tab-group" id="timePeriodTabs">
                        <button class="tab-btn active" data-period="day">
                            Hôm nay
                        </button>
                        <button class="tab-btn" data-period="week">Tuần</button>
                        <button class="tab-btn" data-period="month">
                            Tháng
                        </button>
                        <button class="tab-btn" data-period="all_time">
                            All time
                        </button>
                    </div>
                </div>

                <!-- Stats summary -->
                <div
                    class="card animate-slide-up stagger-2"
                    style="padding: 1.25rem; margin-bottom: 1.5rem"
                >
                    <div class="stats-bar">
                        <div class="stat-item">
                            <div class="stat-value" id="statTotal">—</div>
                            <div class="stat-label">Bài hát</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="statTop">—</div>
                            <div class="stat-label">Top #1 hôm nay</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="statPeriod">
                                Hôm nay
                            </div>
                            <div class="stat-label">Khoảng thời gian</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">Genius</div>
                            <div class="stat-label">Nguồn dữ liệu</div>
                        </div>
                    </div>
                </div>

                <!-- Chart list -->
                <div class="animate-slide-up stagger-3">
                    <div
                        id="chartList"
                        style="
                            display: flex;
                            flex-direction: column;
                            gap: 0.5rem;
                        "
                    >
                        <!-- Skeleton -->
                        ${Array(10).fill(0).map((_, i) => `
                        <div class="chart-item">
                            <span class="chart-position">${i+1}</span>
                            <div class="skeleton chart-image"></div>
                            <div class="chart-info">
                                <div
                                    class="skeleton"
                                    style="
                                        height: 14px;
                                        width: 55%;
                                        margin-bottom: 6px;
                                    "
                                ></div>
                                <div
                                    class="skeleton"
                                    style="height: 12px; width: 38%"
                                ></div>
                            </div>
                        </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="container">
                <div class="footer-inner">
                    <div class="footer-brand">
                        <i class="fa-solid fa-music"></i> Lyrix
                    </div>
                    <div class="footer-links">
                        <a href="index.html">Trang chủ</a>
                    </div>
                    <div class="footer-copy">© 2025 Lyrix.</div>
                </div>
            </div>
        </footer>

        <script src="../scripts/api/genius.js"></script>
        <script src="../scripts/pages/charts.js"></script>
        <script src="../scripts/components/navbar.js"></script>
    </body>
</html>
