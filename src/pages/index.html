<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <style>html,body{background-color:#0d0b14 !important;}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrix - Tra cứu lời bài hát</title>
    <link rel="shortcut icon" type="image/x-icon" href="../../assets/public/images/logo.webp">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="../../assets/public/images/logo.webp" alt="Lyrix Logo" class="navbar-logo">
                Lyrix
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="fas fa-home"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="charts.html"><i class="fas fa-chart-line"></i> Charts</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero / Search Section -->
    <section id="home" class="section active">
        <div class="container">
            <div class="hero-section">
                <h1 class="hero-title">🎵 Lyrix</h1>
                <p class="hero-subtitle">Khám phá lời bài hát, nghệ sĩ và album yêu thích</p>

                <!-- Search Mode Pills -->
                <div class="search-pills">
                    <div class="pill-item active" onclick="setSearchMode('song')">
                        <i class="fas fa-music"></i> Bài hát
                    </div>
                    <div class="pill-item" onclick="setSearchMode('multi')">
                        <i class="fas fa-search"></i> Tất cả
                    </div>
                </div>

                <!-- Search Input -->
                <div class="search-container">
                    <input
                        type="text"
                        id="searchInput"
                        class="search-input"
                        placeholder="Nhập tên bài hát..."
                        oninput="performSearch()"
                        onkeydown="if(event.key==='Enter') performSearch()"
                    >
                    <button class="search-btn" onclick="performSearch()">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>

            <!-- Search Results -->
            <div id="searchResults"></div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="../scripts/api/genius.js"></script>
    <script src="../scripts/pages/index.js"></script>
    <script src="../scripts/components/navbar.js"></script>
</body>
</html>
